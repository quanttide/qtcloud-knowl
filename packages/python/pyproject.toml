[project]
name = "qtcloud-knowl"
version = "0.0.1"
description = "量潮知识云Python SDK"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "quanttide-audit>=0.1.0",
    "quanttide-knowl>=0.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --doctest-modules"
