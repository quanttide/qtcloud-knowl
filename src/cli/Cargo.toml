[package]
name = "qtcloud-knowl-cli"
version = "0.3.0"
edition = "2024"
description = "Knowledge Agent CLI — charting, validation, and ontology management"

[[bin]]
name = "qtcloud-knowl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
quanttide-agent = "0.1.0"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
