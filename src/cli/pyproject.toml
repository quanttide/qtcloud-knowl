[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "integrated_tests*"]

[project]
name = "qtcloud-knowl-cli"
version = "0.0.20"
description = "Knowledge Agent CLI — charting, validation, and ontology management"
requires-python = ">=3.12"
dependencies = [
    "typer",
    "pydantic-settings",
    "pydantic-settings-vault",
    "quanttide",
    "quanttide-agent>=0.3.0",
    "quanttide-knowl",
    "qtcloud-knowl",
]

[project.scripts]
qtcloud-knowl = "app.cli:main"

[tool.uv.sources]
qtcloud-knowl = { path = "../../packages/python", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
