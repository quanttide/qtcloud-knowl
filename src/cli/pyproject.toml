[project]
name = "qtcloud-knowl-cli"
version = "0.0.17"
description = "Knowledge Agent CLI — charting, validation, and ontology management"
requires-python = ">=3.12"
dependencies = [
    "quanttide",
    "quanttide-agent",
    "qtcloud-knowl",
    "pydantic-settings",
    "typer",
]

[project.scripts]
qtcloud-knowl = "app.cli:main"

[tool.uv.sources]
qtcloud-knowl = { path = "../../packages/python", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
